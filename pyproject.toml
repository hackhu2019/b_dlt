[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "b-dlt"
version = "0.1.0"
description = "Offline-first workflow for turning Bilibili creator videos into a local text knowledge base."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = []
